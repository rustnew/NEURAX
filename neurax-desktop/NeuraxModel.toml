schema_version = "1.0"
_warnings = [ "Input block \"n1\" had empty params; auto-fixed to seq mode dim=2048.", "Block \"n8\" (LMHead) missing params.in_features.", "Block \"n8\" (LMHead) missing params.out_features." ]

[model]
name = "NeuraxModel"
type = "ssm"

[model.global_params]
hidden_size = 1024
num_layers = 48
vocab_size = 50280
sequence_length = 2048

[[model.layers]]
id = "n4"
layer_type = "normalization"
input_shape = [ 66, 2048, 1024 ]
output_shape = [ 66, 2048, 1024 ]

[model.layers.params]
normalized_shape = 1024
eps = 0.00001
elementwise_affine = true
position = "pre"
hidden_size = 1024

[[model.layers]]
id = "n2"
layer_type = "embedding"
input_shape = [ 66, 2048 ]
output_shape = [ 66, 2048, 1024 ]

[model.layers.params]
vocab_size = 50280
d_model = 1024
padding_idx = 0
hidden_size = 1024

[[model.layers]]
id = "n5"
layer_type = "mamba_block"
input_shape = [ 66, 2048, 1024 ]
output_shape = [ 66, 2048, 1024 ]

[model.layers.params]
hidden_size = 1024
state_dim = 16
expansion_factor = 2
conv_kernel_size = 4

[[model.layers]]
id = "n6"
layer_type = "custom"
input_shape = [ 66, 2048, 1024 ]
output_shape = [ 66, 2048, 1024 ]

[model.layers.params]
dropout = 0
