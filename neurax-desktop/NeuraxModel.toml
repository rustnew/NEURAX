[[model.layers]]
id = "n7"
layer_type = "normalization"
input_shape = [ 66, 2048, 1024 ]
output_shape = [ 66, 2048, 1024 ]

[model.layers.params]
normalized_shape = 1024
eps = 0.00001
elementwise_affine = true
position = "pre"
hidden_size = 1024

[[model.layers]]
id = "n8"
layer_type = "dense"
input_shape = [ 66, 2048, 1024 ]
output_shape = [ 66, 2048, 50280 ]

[model.layers.params]
d_model = 1024
vocab_size = 50280
bias = false
tie_weights = true
