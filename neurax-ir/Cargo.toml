[package]
name = "neurax-ir"
version = "0.16.0"
edition = "2021"
description = "10 IR dialects for NEURAX"
# Proprietary — closed-source, commercial. publish = false blocks an
# accidental cargo publish to crates.io.
license = "UNLICENSED"
publish = false
repository = "https://github.com/rustnew/NEURAX"
homepage = "https://neurax-canvas.github.io/NEURAX/"
readme = "README.md"
keywords = ["ir", "compiler", "ml", "neural", "analysis"]
categories = ["compilers"]

[dependencies]
# Sérialisation
serde = { workspace = true }
serde_json = { workspace = true }

# Erreurs
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Parallélisme
rayon = { workspace = true }

# Graphes
petgraph = { workspace = true }

# Expression evaluator
evalexpr = { workspace = true }

# Temps
chrono = { workspace = true }

# Hardware detection
num_cpus = { workspace = true }

# Performance
ahash = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
smallvec = { workspace = true }
indexmap = { workspace = true }
itertools = { workspace = true }
once_cell = { workspace = true }

# Crates internes
neurax-parser = { version = "0.16.0", path = "../neurax-parser" }
neurax-formulas = { version = "0.16.0", path = "../neurax-formulas" }
neurax-opspec = { version = "0.16.0", path = "../neurax-opspec" }
neurax-hardware-db = { version = "0.16.0", path = "../neurax-hardware-db" }

[dev-dependencies]
approx = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
