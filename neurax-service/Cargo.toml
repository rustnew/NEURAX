[package]
name = "neurax-service"
version = "0.16.0"
edition = "2021"
description = "HTTP API service for NEURAX analytical compiler"
# Proprietary — closed-source, commercial. publish = false blocks an
# accidental cargo publish to crates.io.
license = "UNLICENSED"
publish = false
repository = "https://github.com/rustnew/NEURAX"
homepage = "https://neurax-canvas.github.io/NEURAX/"
readme = "README.md"
keywords = ["api", "web", "ml", "compiler", "service"]
categories = ["web-programming"]

[dependencies]
neurax-core = { version = "0.16.0", path = "../neurax-core" }
neurax-parser = { version = "0.16.0", path = "../neurax-parser" }
neurax-ir = { version = "0.16.0", path = "../neurax-ir" }
neurax-hardware-db = { version = "0.16.0", path = "../neurax-hardware-db" }
neurax-probe = { version = "0.16.0", path = "../neurax-probe" }
neurax-runtime = { version = "0.16.0", path = "../neurax-runtime" }
actix-web = "4"
actix-ws = "0.2"
actix-cors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
dashmap = "6"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-actix-web = "0.7"
async-stream = "0.3"
futures-util = "0.3"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = "9"
dotenvy = "0.15"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
rand = "0.8"

[dev-dependencies]
# The integration tests drive the service the way the desktop app does — over a
# real loopback socket — so they need a blocking HTTP client.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
