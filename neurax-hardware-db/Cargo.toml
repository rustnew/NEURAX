[package]
name = "neurax-hardware-db"
version = "0.16.0"
edition = "2021"
description = "Hardware database for NEURAX (GPU specs, etc.)"
# Proprietary — closed-source, commercial. publish = false blocks an
# accidental cargo publish to crates.io.
license = "UNLICENSED"
publish = false
repository = "https://github.com/rustnew/NEURAX"
homepage = "https://neurax-canvas.github.io/NEURAX/"
readme = "README.md"
keywords = ["hardware", "gpu", "specs", "database", "ml"]
categories = ["hardware-support", "database"]

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ahash = { workspace = true }

[lints]
workspace = true
