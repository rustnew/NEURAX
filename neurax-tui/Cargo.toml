[package]
name = "neurax-tui"
version = "0.16.0"
edition = "2021"
description = "Terminal User Interface for Neurax IR model compilation visualization"
# Proprietary — closed-source, commercial. publish = false blocks an
# accidental cargo publish to crates.io.
license = "UNLICENSED"
publish = false
repository = "https://github.com/rustnew/NEURAX"
homepage = "https://neurax-canvas.github.io/NEURAX/"
readme = "README.md"
keywords = ["tui", "terminal", "ml", "compiler", "visualization"]
categories = ["command-line-utilities", "visualization"]

[dependencies]
# neurax-ir, neurax-parser, tokio, serde, serde_json, chrono, unicode-width,
# and uuid were declared here but never referenced anywhere in src/ — this
# crate reaches the compiler entirely through neurax_core::analyze_json, it
# never needs the IR/parser crates directly. Confirmed unused via
# `grep -rl` before removing, not just `cargo machete`'s say-so.
neurax-core = { version = "0.16.0", path = "../neurax-core" }

ratatui = { workspace = true }
crossterm = { workspace = true }
color-eyre = { workspace = true }

[[bin]]
name = "neurax-tui"
path = "src/main.rs"
