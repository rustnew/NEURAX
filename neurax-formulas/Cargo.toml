[package]
name = "neurax-formulas"
version = "0.16.0"
edition = "2021"
description = "Analytical formulas for ML operations - Hot path, maximum optimization"
# Proprietary — closed-source, commercial. publish = false blocks an
# accidental cargo publish to crates.io.
license = "UNLICENSED"
publish = false
repository = "https://github.com/rustnew/NEURAX"
homepage = "https://neurax-canvas.github.io/NEURAX/"
readme = "README.md"
keywords = ["ml", "formulas", "analytics", "performance", "neural"]
categories = ["mathematics", "science"]

[dependencies]
tracing = { workspace = true }
evalexpr = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "formulas_bench"
harness = false
