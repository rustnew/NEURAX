name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # `target` used to be part of this cache too and grew to 4+ GB over the
      # life of the repository, back when this job also apt-installed LLVM
      # 18/MLIR to build an MLIR backend crate — enough to tip the runner
      # into a "No space left on device" failure. That crate has been
      # deleted, so this job needs no LLVM at all — the registry and git
      # caches below are what actually save time (skipping re-fetching
      # every crate).
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          # v2: the old key's cache blob bundled `target` into the same
          # archive as the two paths above. Reusing that key here would have
          # restored the same 4+ GB regardless of the shorter `path` list.
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}
          # Without a fallback, any Cargo.lock change misses the cache
          # outright and rebuilds the whole workspace from scratch.
          restore-keys: ${{ runner.os }}-cargo-v2-

      # `cargo test` compiles libs, bins and examples itself, so a preceding
      # `cargo build --workspace` only paid for the same work twice.
      - name: Build and test workspace
        run: cargo test --workspace

      - name: Lint (clippy)
        # NOTE: legacy clippy debt is tracked as warnings (not `-D warnings`) so
        # the build stays green. Pay down debt incrementally and re-enable
        # `-D warnings` once the workspace is warning-free.
        run: cargo clippy --workspace --no-deps

      - name: Format check
        run: cargo fmt --check

  ui-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: neurax-ui/package-lock.json

      # `npm ci` installs the locked tree; `npm install` was free to resolve a
      # different one than the machine that produced the lockfile.
      - name: Install UI deps
        working-directory: neurax-ui
        run: npm ci

      - name: Test UI
        working-directory: neurax-ui
        run: npm test

      - name: Build UI
        working-directory: neurax-ui
        run: npm run build