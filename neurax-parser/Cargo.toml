[package]
name = "neurax-parser"
version = "0.16.0"
edition = "2021"
description = "JSON parsing for NEURAX universal format"
# Proprietary — closed-source, commercial. publish = false blocks an
# accidental cargo publish to crates.io.
license = "UNLICENSED"
publish = false
repository = "https://github.com/rustnew/NEURAX"
homepage = "https://neurax-canvas.github.io/NEURAX/"
readme = "README.md"
keywords = ["parser", "json", "neural", "architecture", "ml"]
categories = ["parser-implementations"]

[dependencies]
# Sérialisation
serde = { workspace = true }
serde_json = { workspace = true }

# Erreurs
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Expression evaluator
evalexpr = { workspace = true }

# Performance
ahash = { workspace = true }
indexmap = { workspace = true }
itertools = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
