[package]
name = "neurax-opspec"
version = "0.16.0"
edition = "2021"
description = "OpSpec-IR: one unified definition (params + FLOPs) per NEURAX operation"
# Proprietary — NEURAX is closed-source and commercial, not MIT/open source.
# `publish = false` blocks an accidental `cargo publish` to crates.io.
license = "UNLICENSED"
publish = false
readme = "README.md"

[dependencies]
neurax-parser = { version = "0.16.0", path = "../neurax-parser" }
neurax-formulas = { version = "0.16.0", path = "../neurax-formulas" }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
